input CreateJobInput {
  jobId: ID
  name: String
  description: String
}

input UpdateJobInput {
  jobId: ID
  name: String
  description: String
  s3Uri: String
  kb: SelectInput
  model: SelectInput
}

type JobConnection {
  jobs: [Job!]
  nextToken: String
}

type Job {
  jobId: ID!
  name: String
  description: String
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
  s3Uri: String
  executionArn: String
  codebuildArn: String
  kb: Select
  model: Select
  agentcoreId: String
}

type Select {
  label: String!
  value: String!
}

input Agents {
  systemPrompt: String
}

input Category {
  name: String
  description: String
}

input CreateWorkflowInput {
  jobId: String
  agents: [Agents]
  rowCategories: [Category]
  columnCategories: [Category]
}

input SelectInput {
  label: String
  value: String
}

type JobMetrics {
  ItemCount: Int
  ItemCountLastWeek: Float
  TableSizeBytes: Int
  TableSizeBytesLastWeek: Float
}

type AssessmentMetrics {
  ExecutionsStartedLastWeek: Float
}

type DashboardMetrics {
  jobs: JobMetrics
  sfnAssessments: AssessmentMetrics
  totalKbs: Int
}

type KnowledgeBaseSummary {
  description: String
  knowledgeBaseId: String
  name: String
  status: String
  updatedAt: AWSDateTime!
}

type KnowledgeBaseConnection {
  knowledgeBaseSummaries: [KnowledgeBaseSummary!]
  nextToken: String
}

type InferenceProfile {
  createdAt: String
  description: String
  inferenceProfileArn: String
  inferenceProfileId: String
  inferenceProfileName: String
  models: [AWSJSON]
  status: String
  type: String
  updatedAt: String
}

type InferenceProfileConnection {
  inferenceProfileSummaries: [InferenceProfile!]
  nextToken: String
}

input ToolCreationUpdateInput {
  jobId: String!
  type: String!
  message: AWSJSON!
  eventId: String!
}

type ToolCreationUpdate @aws_iam {
  jobId: String!
  type: String!
  message: AWSJSON!
  eventId: String!
}

type CodeBuildDetails {
  id: String
  projectName: String
  logs: AWSJSON
  buildStatus: String
}

type Query {
  getDashboardMetrics: DashboardMetrics
  listKnowledgeBases: KnowledgeBaseConnection
  listJobs(limit: Int, nextToken: String): JobConnection
  getJob(jobId: ID): Job

  getCodeBuild(codebuildArn: String): CodeBuildDetails
  describeExecution(executionArn: String!): AWSJSON
  listInferenceProfiles: InferenceProfileConnection
}

type Mutation {
  createJob(input: CreateJobInput!): Job
  updateJob(input: UpdateJobInput!): Job
  deleteJob(jobId: String!): Job
  createWorkflow(input: CreateWorkflowInput): AWSJSON
  startDeployment(jobId: String): AWSJSON

  createTool(
    jobId: String
    prompt: String
    loadHistory: Boolean
    saveTools: Boolean
  ): AWSJSON
  publishToolCreationUpdate(
    input: ToolCreationUpdateInput!
  ): ToolCreationUpdate @aws_iam

  startAssessment(jobId: String, streaming: Boolean): AWSJSON
}

type Subscription {
  onToolCreationUpdate(jobId: String!): ToolCreationUpdate
    @aws_subscribe(mutations: ["publishToolCreationUpdate"])
}
